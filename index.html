<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomas Coward</title>
    <style>
        /* 1. FONT LOADING - Matching your uploaded filenames exactly */
        @font-face {
            font-family: 'HyperScrypt';
            src: url('HyperScrypt.otf') format('opentype');
            font-weight: normal;
        }

        @font-face {
            font-family: 'AlteHaas';
            src: url('alte-haas-grotesk.regular.ttf') format('truetype');
            font-weight: normal;
        }

        @font-face {
            font-family: 'AlteHaasBold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: bold;
        }

        /* 2. BASE RESET */
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #000;
            -webkit-font-smoothing: antialiased;
        }

        /* 3. LAYOUT CONTAINER */
        .page-container {
            padding: 0 30px; /* Your fixed 30px padding */
            max-width: 100%;
            box-sizing: border-box;
        }

        /* 4. HEADER (Name + Nav) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            margin-top: 10px; /* Minimal top margin to match the tight look */
        }

        h1 {
            font-family: 'HyperScrypt', sans-serif;
            margin: 0;
            padding: 0;
            /* Using vw so the text scales with the width of the box below */
            font-size: 8.4vw; 
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        nav {
            font-family: 'AlteHaasBold', sans-serif;
            display: flex;
            gap: 20px;
            margin-top: 15px; /* Slight offset for top-right alignment */
        }

        nav a {
            color: #000;
            text-decoration: none;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        /* 5. THE IMAGE BOX */
        .image-container {
            width: 100%;
            margin-top: 5px; /* Tight gap between text and image */
        }

        .box {
            width: 100%;
            aspect-ratio: 1 / 1.25; /* Adjusted based on your horse image screenshot */
            background-color: #000;
            display: block;
        }

        /* Desktop Cap: prevents text from growing too large on ultra-wide monitors */
        @media (min-width: 1600px) {
            h1 { font-size: 135px; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <header>
            <h1>Tomas Coward</h1>
            <nav>
                <a href="work.html">Work</a>
                <a href="about.html">About</a>
            </nav>
        </header>

        <div class="image-container">
            <div class="box"></div>
        </div>
    </div>

</body>
</html>
