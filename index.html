<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomas Coward</title>

    <link rel="preload" href="HyperScrypt.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="AlteHaasGroteskBold.ttf" as="font" type="font/ttf" crossorigin>

    <style>
        @font-face {
            font-family: 'HyperScrypt';
            src: url('HyperScrypt.otf') format('opentype');
            font-display: swap; 
        }
        @font-face {
            font-family: 'AlteHaasBold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: bold;
            font-display: swap;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden; /* This keeps your "locked" layout feeling intact */
            background: #fff;
            cursor: none;
        }

        #custom-cursor {
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
            transition: transform 0.05s ease-out;
        }

        /* Using <main> class for the 48% column layout */
        .content-stack {
            width: 48%;
            height: 100vh;
            margin-left: 50px;
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .header-outer {
            width: 100%;
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
        }

        .header-row {
            flex-grow: 1;
            overflow: hidden;
            padding-bottom: 10px;
            display: flex;
            align-items: flex-end;
            box-sizing: border-box;
        }

        .fluid-name {
            /* Full Fallback Chain: HyperScrypt -> AlteHaasBold -> Helvetica -> Arial */
            font-family: 'HyperScrypt', 'AlteHaasBold', 'Helvetica', 'Arial', sans-serif;
            text-transform: uppercase;
            font-size: 120px;
            line-height: 1;
            margin: 0;
            white-space: nowrap;
            display: inline-block;
            transform-origin: left bottom;
        }

        nav {
            display: flex;
            gap: 20px;
            font-family: 'AlteHaasBold', 'Helvetica', 'Arial', sans-serif;
        }

        @media (min-width: 801px) {
            nav {
                position: fixed;
                right: 50px;
                align-items: center;
            }
        }

        .nav-link {
            color: #000;
            text-decoration: none;
            font-size: 24px;
            text-transform: uppercase;
            cursor: none;
            transition: filter 0.3s ease-out, color 0.2s ease;
        }

        .nav-link:hover {
            filter: blur(4px);
            color: #444;
        }

        .image-container {
            flex-grow: 1;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: top;
        }

        /* Tablet */
        @media (max-width: 1024px) and (min-width: 801px) {
            .content-stack { width: calc(48% - 20px); margin-left: 30px; }
            nav { right: 30px; }
        }

        /* Mobile */
        @media (max-width: 800px) {
            html, body { cursor: auto; }
            #custom-cursor { display: none; }
            .content-stack { width: calc(100% - 40px); margin-left: 20px; }
            nav { position: relative; align-items: flex-end; padding: 0 0 10px 15px; flex-shrink: 0; }
            .nav-link { font-size: 16px; cursor: auto; }
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <main class="content-stack">
        <div class="header-outer">
            <div class="header-row" id="header-row">
                <h1 class="fluid-name" id="name-text">TOMAS COWARD</h1>
            </div>
            <nav id="main-nav">
                <a href="work.html" class="nav-link">Work</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
        </div>
        <div class="image-container">
            <img src="home.webp" alt="Tomas Coward">
        </div>
    </main>

    <script>
        var headerRow = document.getElementById('header-row');
        var stack     = document.querySelector('.content-stack');
        var text      = document.getElementById('name-text');
        var nav       = document.getElementById('main-nav');

        function fitText() {
            var mobile = window.innerWidth <= 800;
            text.style.transform = 'scale(1)';

            var targetWidth  = mobile ? headerRow.clientWidth : stack.clientWidth;
            var textWidth    = text.offsetWidth;
            var textHeight   = text.offsetHeight;
            if (!textWidth) return;

            var scale        = targetWidth / textWidth;
            var scaledHeight = textHeight * scale;

            text.style.transform   = 'scale(' + scale + ')';
            headerRow.style.height = (scaledHeight + 10) + 'px';

            nav.style.top = mobile ? '' : (14 + (scaledHeight + 10) / 2 - nav.offsetHeight / 2) + 'px';
        }

        document.fonts.ready.then(fitText);
        window.addEventListener('resize', fitText);

        var cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', function(e) {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top  = e.clientY + 'px';
        });
    </script>
</body>
</html>
